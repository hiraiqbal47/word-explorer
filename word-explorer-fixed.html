<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f3f0ff;min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:12px}
.header{background:#fff;border:1px solid #e5e1fb;border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(127,119,221,.08)}
.logo{font-size:18px;font-weight:600;color:#1a1a2e}
.logo span{color:#7F77DD}
.hud{display:flex;align-items:center;gap:10px}
.pts{font-size:14px;font-weight:600;color:#7F77DD;background:#EEEDFE;padding:4px 10px;border-radius:20px}
.stars-hud{font-size:14px;color:#BA7517;background:#FAEEDA;padding:4px 10px;border-radius:20px}
.progress-wrap{background:#fff;border:1px solid #e5e1fb;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(127,119,221,.06)}
.progress-label{font-size:12px;color:#666;margin-bottom:7px;display:flex;justify-content:space-between}
.progress-bar{height:10px;background:#f0eeff;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#7F77DD,#5DCAA5);border-radius:20px;transition:width .5s}
.badges-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:600}
.badge.earned{background:#E1F5EE;color:#0F6E56;border:1px solid #9FE1CB}
.badge.locked{background:#f5f5f5;color:#aaa;border:1px solid #e8e8e8}
.screen{display:none}
.screen.active{display:block}
.section-title{font-size:11px;font-weight:700;color:#999;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.cat-card{background:#fff;border:1px solid #e8e8ee;border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;user-select:none}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.cat-icon{font-size:30px;margin-bottom:6px}
.cat-name{font-size:14px;font-weight:600;color:#1a1a2e}
.cat-count{font-size:11px;color:#999;margin-top:2px}
.activity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.act-card{background:#fff;border:1px solid #e8e8ee;border-radius:14px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.act-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.act-icon{font-size:26px;margin-bottom:6px}
.act-name{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:2px}
.act-desc{font-size:11px;color:#999}
.game-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back-btn{background:#fff;border:1px solid #e0ddf6;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;color:#666;font-weight:500;transition:background .15s}
.back-btn:hover{background:#f5f3ff}
.game-title{font-size:16px;font-weight:600;color:#1a1a2e}
.q-count{font-size:12px;color:#999;margin-left:auto;background:#f5f5f5;padding:3px 9px;border-radius:10px}
.game-card{background:#fff;border:1px solid #e8e8ee;border-radius:16px;padding:20px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.word-display{text-align:center;padding:8px 0 16px}
.big-word{font-size:38px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.big-emoji{font-size:56px;margin-bottom:8px;display:block}
.question-text{font-size:14px;color:#666;margin-bottom:10px;text-align:center}
.mc-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mc-btn{background:#f8f7ff;border:1.5px solid #e5e1fb;border-radius:12px;padding:11px 12px;cursor:pointer;font-size:13px;color:#333;text-align:left;transition:background .15s,border-color .15s;line-height:1.4}
.mc-btn:hover:not(:disabled){background:#eeedfe;border-color:#7F77DD}
.mc-btn.correct{background:#E1F5EE!important;border-color:#1D9E75!important;color:#085041!important;font-weight:600}
.mc-btn.wrong{background:#FCEBEB!important;border-color:#E24B4A!important;color:#501313!important}
.mc-btn:disabled{cursor:default}
.fitb-wrap{margin-top:12px}
.fitb-sentence{font-size:17px;font-weight:500;color:#1a1a2e;line-height:1.6;text-align:center;padding:8px 0 4px}
.fitb-hint{font-size:13px;color:#888;margin:6px 0 10px;text-align:center}
.fitb-input{width:100%;padding:11px 14px;border:1.5px solid #d0ccee;border-radius:12px;font-size:16px;background:#fff;color:#1a1a2e;outline:none;transition:border-color .2s}
.fitb-input:focus{border-color:#7F77DD;box-shadow:0 0 0 3px rgba(127,119,221,.12)}
.submit-btn{background:linear-gradient(135deg,#7F77DD,#534AB7);color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;width:100%;transition:opacity .15s,transform .1s}
.submit-btn:hover{opacity:.9;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none}
.feedback-box{border-radius:14px;padding:14px;margin-top:12px}
.feedback-box.correct{background:#E1F5EE;border:1.5px solid #5DCAA5}
.feedback-box.wrong{background:#FCEBEB;border:1.5px solid #F09595}
.feedback-title{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.feedback-title.correct{color:#085041}
.feedback-title.wrong{color:#A32D2D}
.streak-badge{font-size:11px;font-weight:700;background:#FAEEDA;color:#633806;padding:2px 8px;border-radius:10px;border:1px solid #FAC775}
.feedback-word{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.feedback-pronunciation{font-size:13px;color:#534AB7;font-style:italic;margin:3px 0}
.feedback-meaning{font-size:13px;color:#555;margin-bottom:6px}
.feedback-example{font-size:13px;color:#333;background:rgba(255,255,255,.7);padding:7px 11px;border-radius:9px;font-style:italic;line-height:1.5}
.next-btn{background:#fff;border:1.5px solid #d0ccee;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;width:100%;color:#534AB7;transition:background .15s}
.next-btn:hover{background:#f5f3ff}
.memory-grid{display:grid;gap:8px;margin-top:8px}
.mem-card{background:#f0eeff;border:1.5px solid #d5d1f5;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;transition:background .2s,transform .15s;user-select:none}
.mem-card:hover:not(.matched){transform:scale(1.04)}
.mem-card.flipped{background:#EEEDFE;border-color:#7F77DD}
.mem-card.matched{background:#E1F5EE;border-color:#1D9E75;cursor:default}
.pair-matching{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pair-col{display:flex;flex-direction:column;gap:7px}
.pair-item{background:#f8f7ff;border:1.5px solid #e5e1fb;border-radius:12px;padding:11px 10px;cursor:pointer;font-size:14px;text-align:center;transition:background .15s,border-color .15s;font-weight:500;min-height:46px;display:flex;align-items:center;justify-content:center}
.pair-item:hover:not(.matched){background:#eeedfe;border-color:#7F77DD}
.pair-item.selected{background:#EEEDFE;border-color:#7F77DD;border-width:2px}
.pair-item.matched{background:#E1F5EE;border-color:#1D9E75;cursor:default;color:#085041}
.pair-item.wrong-flash{background:#FCEBEB;border-color:#E24B4A;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.score-screen{text-align:center;padding:24px 20px}
.score-big{font-size:56px;font-weight:700;color:#7F77DD;margin-bottom:6px}
.score-label{font-size:16px;color:#666;margin-bottom:20px}
.score-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.score-emoji{font-size:58px;margin-bottom:8px;display:block}
.play-again-btn{background:linear-gradient(135deg,#7F77DD,#534AB7);color:#fff;border:none;border-radius:14px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;width:100%}
.play-again-btn:hover{opacity:.9}
@media(max-width:420px){
  .mc-options{grid-template-columns:1fr}
  .big-word{font-size:28px}
  .big-emoji{font-size:44px}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">📖 <span>Word</span> Explorer</div>
    <div class="hud">
      <span class="stars-hud">⭐ <span id="starsCount">0</span></span>
      <span class="pts">⚡ <span id="pointsCount">0</span> pts</span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Level <strong id="levelNum">1</strong></span>
      <span><span id="progressPct">0</span>% to next level</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="badges-row" id="badgesRow"></div>
  </div>

  <div class="screen active" id="homeScreen">
    <div class="section-title">Choose a category</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="section-title">Activities</div>
    <div class="activity-grid" id="actGrid"></div>
  </div>

  <div class="screen" id="gameScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goHome()">← Home</button>
      <span class="game-title" id="gameTitle"></span>
      <span class="q-count" id="qCount"></span>
    </div>
    <div id="gameContent"></div>
  </div>

  <div class="screen" id="scoreScreen">
    <div class="game-card score-screen">
      <span class="score-emoji" id="scoreEmoji">🎉</span>
      <div class="score-big" id="scoreBig">0</div>
      <div class="score-label">points earned this round!</div>
      <div class="score-badges" id="scoreBadges"></div>
      <button class="play-again-btn" onclick="goHome()">Play more →</button>
    </div>
  </div>
</div>

<script>
var WORDS={
  food:[
    {word:"apple",emoji:"🍎",meaning:"A round red or green fruit",pronunciation:"/ˈæp.əl/",example:"I eat an apple every morning."},
    {word:"bread",emoji:"🍞",meaning:"A food made from flour and water, baked",pronunciation:"/bred/",example:"She buys fresh bread from the bakery."},
    {word:"milk",emoji:"🥛",meaning:"A white drink that comes from cows",pronunciation:"/mɪlk/",example:"Children drink milk at school."},
    {word:"egg",emoji:"🥚",meaning:"An oval food with a shell, from a chicken",pronunciation:"/ɛɡ/",example:"He cooks an egg for breakfast."},
    {word:"cake",emoji:"🎂",meaning:"A sweet food made from flour, eggs and sugar",pronunciation:"/keɪk/",example:"We eat cake on birthdays."},
    {word:"rice",emoji:"🍚",meaning:"Small white grains that you cook and eat",pronunciation:"/raɪs/",example:"Rice is popular in many countries."},
    {word:"soup",emoji:"🍲",meaning:"A hot liquid food with vegetables or meat",pronunciation:"/suːp/",example:"She made tomato soup for dinner."},
    {word:"fish",emoji:"🐟",meaning:"An animal from water that people eat as food",pronunciation:"/fɪʃ/",example:"We had grilled fish for lunch."}
  ],
  animals:[
    {word:"cat",emoji:"🐱",meaning:"A small furry pet animal that says meow",pronunciation:"/kæt/",example:"The cat is sleeping on the sofa."},
    {word:"dog",emoji:"🐶",meaning:"A loyal pet animal that says woof",pronunciation:"/dɒɡ/",example:"My dog loves to run in the park."},
    {word:"bird",emoji:"🐦",meaning:"An animal with wings and feathers that can fly",pronunciation:"/bɜːrd/",example:"A beautiful bird is singing in the tree."},
    {word:"rabbit",emoji:"🐰",meaning:"A small furry animal with long ears",pronunciation:"/ˈræb.ɪt/",example:"The rabbit hopped across the garden."},
    {word:"horse",emoji:"🐴",meaning:"A large animal that people ride",pronunciation:"/hɔːrs/",example:"She rides her horse every weekend."},
    {word:"cow",emoji:"🐮",meaning:"A large farm animal that gives milk",pronunciation:"/kaʊ/",example:"The cow is eating grass in the field."},
    {word:"frog",emoji:"🐸",meaning:"A small green animal that lives near water",pronunciation:"/frɒɡ/",example:"The frog jumped into the pond."},
    {word:"bear",emoji:"🐻",meaning:"A large wild animal with thick fur",pronunciation:"/beər/",example:"A brown bear lives in that forest."}
  ],
  colors:[
    {word:"red",emoji:"🔴",meaning:"The color of fire or blood",pronunciation:"/rɛd/",example:"She wore a red dress to the party."},
    {word:"blue",emoji:"🔵",meaning:"The color of the sky and the sea",pronunciation:"/bluː/",example:"The sky is blue today."},
    {word:"green",emoji:"🟢",meaning:"The color of trees and grass",pronunciation:"/ɡriːn/",example:"The green leaves are beautiful in spring."},
    {word:"yellow",emoji:"🟡",meaning:"The color of the sun and lemons",pronunciation:"/ˈjɛl.oʊ/",example:"She painted her room yellow."},
    {word:"orange",emoji:"🟠",meaning:"A color that is a mix of red and yellow",pronunciation:"/ˈɒr.ɪndʒ/",example:"He likes to wear orange shirts."},
    {word:"purple",emoji:"🟣",meaning:"A dark color mixing red and blue",pronunciation:"/ˈpɜːr.pəl/",example:"Purple is the color of lavender flowers."},
    {word:"pink",emoji:"🩷",meaning:"A light red color",pronunciation:"/pɪŋk/",example:"The little girl's room is painted pink."},
    {word:"white",emoji:"⬜",meaning:"The color of snow and clouds",pronunciation:"/waɪt/",example:"She wore a white wedding dress."}
  ],
  family:[
    {word:"mother",emoji:"👩",meaning:"A woman who has children; your mom",pronunciation:"/ˈmʌð.ər/",example:"My mother cooks delicious food."},
    {word:"father",emoji:"👨",meaning:"A man who has children; your dad",pronunciation:"/ˈfɑː.ðər/",example:"My father goes to work every day."},
    {word:"sister",emoji:"👧",meaning:"A girl who has the same parents as you",pronunciation:"/ˈsɪs.tər/",example:"My sister and I share a bedroom."},
    {word:"brother",emoji:"👦",meaning:"A boy who has the same parents as you",pronunciation:"/ˈbrʌð.ər/",example:"My brother is two years older than me."},
    {word:"baby",emoji:"👶",meaning:"A very young child",pronunciation:"/ˈbeɪ.bi/",example:"The baby is sleeping in the crib."},
    {word:"grandmother",emoji:"👵",meaning:"The mother of your mother or father",pronunciation:"/ˈɡrænd.mʌð.ər/",example:"My grandmother tells great stories."},
    {word:"grandfather",emoji:"👴",meaning:"The father of your mother or father",pronunciation:"/ˈɡrænd.fɑː.ðər/",example:"My grandfather likes to fish."},
    {word:"family",emoji:"👨‍👩‍👧‍👦",meaning:"A group of people related to each other",pronunciation:"/ˈfæm.ɪ.li/",example:"My family eats dinner together every night."}
  ],
  school:[
    {word:"book",emoji:"📚",meaning:"An object with pages that you read",pronunciation:"/bʊk/",example:"She reads a book before bed."},
    {word:"pencil",emoji:"✏️",meaning:"A tool you use to write or draw",pronunciation:"/ˈpɛn.sɪl/",example:"Please write with a pencil, not a pen."},
    {word:"teacher",emoji:"👩‍🏫",meaning:"A person who helps students learn",pronunciation:"/ˈtiː.tʃər/",example:"Our teacher is very kind and helpful."},
    {word:"desk",emoji:"🪑",meaning:"A table where you study or work",pronunciation:"/dɛsk/",example:"Put your books on the desk."},
    {word:"class",emoji:"🏫",meaning:"A group of students who learn together",pronunciation:"/klɑːs/",example:"Our class has twenty students."},
    {word:"pen",emoji:"🖊️",meaning:"A tool you use to write with ink",pronunciation:"/pɛn/",example:"She signed the letter with a pen."},
    {word:"bag",emoji:"🎒",meaning:"A container you carry books and things in",pronunciation:"/bæɡ/",example:"He puts his lunch in his school bag."},
    {word:"ruler",emoji:"📏",meaning:"A flat tool used to measure or draw straight lines",pronunciation:"/ˈruː.lər/",example:"Use a ruler to draw a straight line."}
  ]
};

var CATEGORIES=[
  {id:"food",name:"Food",emoji:"🍎",color:"#F0997B"},
  {id:"animals",name:"Animals",emoji:"🐾",color:"#1D9E75"},
  {id:"colors",name:"Colors",emoji:"🎨",color:"#D4537E"},
  {id:"family",name:"Family",emoji:"👨‍👩‍👧",color:"#7F77DD"},
  {id:"school",name:"School",emoji:"🏫",color:"#378ADD"}
];

var ACTIVITIES=[
  {id:"quiz",name:"Word Quiz",icon:"❓",desc:"Choose the correct meaning"},
  {id:"match",name:"Picture Match",icon:"🧩",desc:"Match words to pictures"},
  {id:"fillblank",name:"Fill the Blank",icon:"✏️",desc:"Complete the sentence"},
  {id:"memory",name:"Memory Game",icon:"🃏",desc:"Find matching pairs"}
];

var BADGES_DEF=[
  {id:"first",label:"First Word!",condition:function(p){return p.totalAnswered>=1;}},
  {id:"streak5",label:"5 in a row!",condition:function(p){return p.bestStreak>=5;}},
  {id:"star10",label:"10 Stars",condition:function(p){return p.stars>=10;}},
  {id:"pts100",label:"100 Points",condition:function(p){return p.points>=100;}},
  {id:"explorer",label:"Explorer",condition:function(p){return p.categories.size>=3;}},
  {id:"master",label:"Master",condition:function(p){return p.points>=500;}}
];

var state={points:0,stars:0,level:1,levelProgress:0,bestStreak:0,currentStreak:0,totalAnswered:0,categories:new Set(),earnedBadges:new Set()};
var game={cat:null,activity:null,words:[],index:0,score:0,answered:false,memCards:[],memFlipped:[],memMatched:0,memLock:false,matchState:null};

function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem('wordExplorerState')||'null');
    if(s){
      state.points=s.points||0;state.stars=s.stars||0;state.level=s.level||1;
      state.levelProgress=s.levelProgress||0;state.bestStreak=s.bestStreak||0;
      state.currentStreak=s.currentStreak||0;state.totalAnswered=s.totalAnswered||0;
      state.categories=new Set(s.categories||[]);state.earnedBadges=new Set(s.earnedBadges||[]);
    }
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem('wordExplorerState',JSON.stringify({
      points:state.points,stars:state.stars,level:state.level,levelProgress:state.levelProgress,
      bestStreak:state.bestStreak,currentStreak:state.currentStreak,totalAnswered:state.totalAnswered,
      categories:Array.from(state.categories),earnedBadges:Array.from(state.earnedBadges)
    }));
  }catch(e){}
}
function addPoints(pts){
  state.points+=pts;
  if(state.points>=(state.level*100)){state.level++;state.levelProgress=0;}
  else{state.levelProgress=Math.min(99,Math.round(state.points%100));}
  updateHUD();saveState();
}
function addStar(){state.stars++;updateHUD();saveState();}
function checkBadges(){
  BADGES_DEF.forEach(function(b){
    if(!state.earnedBadges.has(b.id)&&b.condition(state)){state.earnedBadges.add(b.id);saveState();}
  });
  renderBadges();
}
function updateHUD(){
  document.getElementById('pointsCount').textContent=state.points;
  document.getElementById('starsCount').textContent=state.stars;
  document.getElementById('levelNum').textContent=state.level;
  document.getElementById('progressPct').textContent=Math.min(99,state.levelProgress);
  document.getElementById('progressFill').style.width=Math.min(100,state.levelProgress)+'%';
  checkBadges();
}
function renderBadges(){
  document.getElementById('badgesRow').innerHTML=BADGES_DEF.map(function(b){
    return '<span class="badge '+(state.earnedBadges.has(b.id)?'earned':'locked')+'">'+(state.earnedBadges.has(b.id)?'✓ ':'🔒 ')+b.label+'</span>';
  }).join('');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}
function goHome(){showScreen('homeScreen');}
function shuffle(arr){return arr.slice().sort(function(){return Math.random()-.5;});}
function pickWords(cat,n){
  n=n||6;
  var src=cat?WORDS[cat]:Object.values(WORDS).reduce(function(a,b){return a.concat(b);},[]);
  return shuffle(src).slice(0,n);
}

function initHome(){
  document.getElementById('catGrid').innerHTML=CATEGORIES.map(function(c){
    return '<div class="cat-card" onclick="startWithCat(\''+c.id+'\')" style="border-top:3px solid '+c.color+'">'+
      '<div class="cat-icon">'+c.emoji+'</div>'+
      '<div class="cat-name">'+c.name+'</div>'+
      '<div class="cat-count">'+WORDS[c.id].length+' words</div></div>';
  }).join('');
  document.getElementById('actGrid').innerHTML=ACTIVITIES.map(function(a){
    return '<div class="act-card" onclick="startActivity(\''+a.id+'\',null)">'+
      '<div class="act-icon">'+a.icon+'</div>'+
      '<div class="act-name">'+a.name+'</div>'+
      '<div class="act-desc">'+a.desc+'</div></div>';
  }).join('');
}

function startWithCat(catId){
  var act=ACTIVITIES[Math.floor(Math.random()*ACTIVITIES.length)];
  startActivity(act.id,catId);
}
function startActivity(actId,catId){
  game.cat=catId;game.activity=actId;
  game.words=pickWords(catId,actId==='memory'?4:6);
  game.index=0;game.score=0;game.answered=false;
  if(catId)state.categories.add(catId);
  showScreen('gameScreen');
  var cat=CATEGORIES.filter(function(c){return c.id===catId;})[0];
  var act=ACTIVITIES.filter(function(a){return a.id===actId;})[0];
  document.getElementById('gameTitle').textContent=(cat?cat.emoji+' ':'')+act.name;
  renderGame();
}
function renderGame(){
  var c=document.getElementById('gameContent');
  if(game.activity==='quiz')renderQuiz(c);
  else if(game.activity==='match')renderMatch(c);
  else if(game.activity==='fillblank')renderFillBlank(c);
  else if(game.activity==='memory')renderMemory(c);
  document.getElementById('qCount').textContent=game.activity==='memory'?'':((game.index+1)+' / '+game.words.length);
}

function renderQuiz(c){
  var w=game.words[game.index];
  var all=Object.values(WORDS).reduce(function(a,b){return a.concat(b);},[]);
  var wrongs=shuffle(all.filter(function(x){return x.word!==w.word;})).slice(0,3);
  var opts=shuffle([w].concat(wrongs));
  var html='<div class="game-card"><div class="word-display"><span class="big-emoji">'+w.emoji+'</span><div class="big-word">'+w.word+'</div></div>';
  html+='<div class="question-text">What does this word mean?</div><div class="mc-options">';
  opts.forEach(function(o,i){
    html+='<button class="mc-btn" id="opt'+i+'" onclick="checkQuiz(\''+o.word+'\',\''+w.word+'\','+i+')">'+o.meaning+'</button>';
  });
  html+='</div><div id="feedback"></div></div>';
  c.innerHTML=html;
}
function checkQuiz(chosen,correct,idx){
  if(game.answered)return;
  game.answered=true;state.totalAnswered++;
  var btns=document.querySelectorAll('.mc-btn');
  btns.forEach(function(b){b.disabled=true;});
  var w=game.words[game.index];
  if(chosen===correct){
    state.currentStreak++;if(state.currentStreak>state.bestStreak)state.bestStreak=state.currentStreak;
    btns[idx].classList.add('correct');
    addPoints(10+(state.currentStreak>1?5:0));addStar();game.score+=10;
  } else {
    state.currentStreak=0;btns[idx].classList.add('wrong');
    btns.forEach(function(b){if(b.textContent===w.meaning)b.classList.add('correct');});
  }
  showFeedback(chosen===correct,w);saveState();checkBadges();
}

function renderFillBlank(c){
  var w=game.words[game.index];
  var re=new RegExp(w.word,'i');
  var blanked=w.example.replace(re,'_____');
  var html='<div class="game-card"><div class="word-display"><span class="big-emoji">'+w.emoji+'</span></div>';
  html+='<div class="fitb-wrap"><div class="fitb-sentence">'+blanked+'</div>';
  html+='<div class="fitb-hint">Hint: starts with "'+w.word[0].toUpperCase()+'" ('+w.word.length+' letters)</div>';
  html+='<input class="fitb-input" id="fitbInput" type="text" placeholder="Type the missing word..." autocomplete="off" autocapitalize="none" />';
  html+='<button class="submit-btn" id="fitbBtn" onclick="checkFillBlank(\''+w.word+'\')">Check ✓</button>';
  html+='</div><div id="feedback"></div></div>';
  c.innerHTML=html;
  var inp=document.getElementById('fitbInput');
  inp.focus();
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')checkFillBlank(w.word);});
}
function checkFillBlank(correct){
  if(game.answered)return;
  var inp=document.getElementById('fitbInput');
  var val=inp.value.trim().toLowerCase();
  if(!val)return;
  game.answered=true;state.totalAnswered++;
  inp.disabled=true;document.getElementById('fitbBtn').disabled=true;
  var w=game.words[game.index];
  var ok=val===correct.toLowerCase();
  if(ok){
    state.currentStreak++;if(state.currentStreak>state.bestStreak)state.bestStreak=state.currentStreak;
    inp.style.borderColor='#1D9E75';addPoints(15);addStar();game.score+=15;
  } else {
    state.currentStreak=0;inp.style.borderColor='#E24B4A';
  }
  showFeedback(ok,w);saveState();checkBadges();
}

function renderMatch(c){
  var words=game.words.slice(0,5);
  game.matchState={words:shuffle(words),emojis:shuffle(words),selWord:null,selEmoji:null,selWordVal:null,selEmojiVal:null,matched:new Set()};
  c.innerHTML='<div class="game-card"><div class="question-text">Match each word with its picture:</div><div class="pair-matching"><div class="pair-col" id="wordCol"></div><div class="pair-col" id="emojiCol"></div></div><div id="feedback"></div></div>';
  renderMatchItems();
}
function renderMatchItems(){
  var ms=game.matchState;
  document.getElementById('wordCol').innerHTML=ms.words.map(function(w,i){
    return '<div class="pair-item'+(ms.matched.has(w.word)?' matched':'')+'" id="wrd'+i+'" onclick="selectMatch(\'word\','+i+',\''+w.word+'\')">'+w.word+'</div>';
  }).join('');
  document.getElementById('emojiCol').innerHTML=ms.emojis.map(function(w,i){
    return '<div class="pair-item'+(ms.matched.has(w.word)?' matched':'')+'" id="emj'+i+'" onclick="selectMatch(\'emoji\','+i+',\''+w.word+'\')" style="font-size:24px">'+w.emoji+'</div>';
  }).join('');
}
function selectMatch(type,idx,word){
  var ms=game.matchState;
  if(ms.matched.has(word))return;
  if(type==='word'){
    if(ms.selWord!==null)document.getElementById('wrd'+ms.selWord).classList.remove('selected');
    ms.selWord=idx;ms.selWordVal=word;document.getElementById('wrd'+idx).classList.add('selected');
  } else {
    if(ms.selEmoji!==null)document.getElementById('emj'+ms.selEmoji).classList.remove('selected');
    ms.selEmoji=idx;ms.selEmojiVal=word;document.getElementById('emj'+idx).classList.add('selected');
  }
  if(ms.selWord!==null&&ms.selEmoji!==null){
    if(ms.selWordVal===ms.selEmojiVal){
      ms.matched.add(ms.selWordVal);
      var we=document.getElementById('wrd'+ms.selWord);var ee=document.getElementById('emj'+ms.selEmoji);
      we.classList.remove('selected');we.classList.add('matched');
      ee.classList.remove('selected');ee.classList.add('matched');
      addPoints(10);addStar();game.score+=10;state.totalAnswered++;saveState();checkBadges();
      if(ms.matched.size===ms.words.length)setTimeout(function(){showEndScreen();},600);
    } else {
      var we2=document.getElementById('wrd'+ms.selWord);var ee2=document.getElementById('emj'+ms.selEmoji);
      we2.classList.add('wrong-flash');ee2.classList.add('wrong-flash');
      setTimeout(function(){we2.classList.remove('selected','wrong-flash');ee2.classList.remove('selected','wrong-flash');},400);
    }
    ms.selWord=null;ms.selEmoji=null;ms.selWordVal=null;ms.selEmojiVal=null;
  }
}

function renderMemory(c){
  var words=game.words.slice(0,4);
  var wPairs=words.map(function(w){return Object.assign({},w,{kind:'word'});});
  var ePairs=words.map(function(w){return Object.assign({},w,{kind:'emoji'});});
  var pairs=shuffle(wPairs.concat(ePairs));
  game.memCards=pairs.map(function(w,i){return Object.assign({},w,{id:i,flipped:false,matched:false});});
  game.memFlipped=[];game.memMatched=0;game.memLock=false;
  var cols=Math.ceil(Math.sqrt(pairs.length));
  var cards=pairs.map(function(_,i){return '<div class="mem-card" id="mem'+i+'" onclick="flipMem('+i+')">?</div>';}).join('');
  c.innerHTML='<div class="game-card"><div class="question-text">Find all matching word-picture pairs!</div><div class="memory-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+cards+'</div><div id="feedback"></div></div>';
}
function flipMem(i){
  if(game.memLock)return;
  var card=game.memCards[i];
  if(card.flipped||card.matched)return;
  card.flipped=true;
  var el=document.getElementById('mem'+i);
  el.classList.add('flipped');
  el.innerHTML=card.kind==='emoji'?'<span style="font-size:28px">'+card.emoji+'</span>':'<span style="font-size:13px;font-weight:700">'+card.word+'</span>';
  game.memFlipped.push(i);
  if(game.memFlipped.length===2){
    game.memLock=true;
    var a=game.memFlipped[0];var b=game.memFlipped[1];
    var ca=game.memCards[a];var cb=game.memCards[b];
    if(ca.word===cb.word&&ca.kind!==cb.kind){
      setTimeout(function(){
        document.getElementById('mem'+a).classList.add('matched');
        document.getElementById('mem'+b).classList.add('matched');
        ca.matched=true;cb.matched=true;game.memMatched++;
        addPoints(20);addStar();state.totalAnswered++;saveState();checkBadges();
        game.memFlipped=[];game.memLock=false;
        if(game.memMatched===game.words.slice(0,4).length)setTimeout(function(){showEndScreen();},600);
      },400);
    } else {
      setTimeout(function(){
        [a,b].forEach(function(idx){
          var e=document.getElementById('mem'+idx);
          e.classList.remove('flipped');e.innerHTML='?';game.memCards[idx].flipped=false;
        });
        game.memFlipped=[];game.memLock=false;
      },900);
    }
  }
}

function showFeedback(correct,w){
  var streakHtml=state.currentStreak>1?'<span class="streak-badge">🔥 '+state.currentStreak+' streak!</span>':'';
  var nextLabel=game.index<game.words.length-1?'Next word →':'See results 🏆';
  document.getElementById('feedback').innerHTML=
    '<div class="feedback-box '+(correct?'correct':'wrong')+'">' +
    '<div class="feedback-title '+(correct?'correct':'wrong')+'">'+(correct?'✓ Correct! +10 pts':'✗ Not quite — keep going!')+' '+streakHtml+'</div>'+
    '<div class="feedback-word">'+w.emoji+' '+w.word+'</div>'+
    '<div class="feedback-pronunciation">'+w.pronunciation+'</div>'+
    '<div class="feedback-meaning">'+w.meaning+'</div>'+
    '<div class="feedback-example">"'+w.example+'"</div></div>'+
    '<button class="next-btn" onclick="nextQuestion()">'+nextLabel+'</button>';
}
function nextQuestion(){
  game.index++;game.answered=false;
  if(game.index>=game.words.length){showEndScreen();return;}
  renderGame();
}
function showEndScreen(){
  var pts=game.score;
  document.getElementById('scoreEmoji').textContent=pts>=80?'🏆':pts>=40?'🌟':'👏';
  document.getElementById('scoreBig').textContent=pts;
  document.getElementById('scoreBadges').innerHTML=BADGES_DEF.filter(function(b){return state.earnedBadges.has(b.id);}).map(function(b){return '<span class="badge earned">✓ '+b.label+'</span>';}).join('');
  showScreen('scoreScreen');
}

loadState();initHome();updateHUD();
</script>
</body>
